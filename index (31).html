<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f0f5;--mut:#9db0c0;--paper:#0c1620;--card:#13212e;--line:#223647;--teal:#2fb8b0;--on:#06201f;--tint:#12302f;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e8f0f5;--mut:#9db0c0;--paper:#0c1620;--card:#13212e;--line:#223647;--teal:#2fb8b0;--on:#06201f;--tint:#12302f;--bad:#ff8a80;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--paper);border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;min-height:64px;gap:10px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 1.4rem "Bricolage Grotesque",sans-serif;cursor:pointer;background:none;border:0;padding:0}.logo svg{width:38px;height:38px}.logo b{color:var(--teal);font-weight:800}
.btn{display:inline-block;background:var(--teal);color:var(--on);font:600 .95rem Figtree,sans-serif;border:2px solid var(--teal);border-radius:10px;padding:9px 16px;text-decoration:none;cursor:pointer;min-height:42px}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hero{padding:56px 0 40px}.hero h1{font-size:clamp(2.3rem,6vw,3.8rem);font-weight:800;letter-spacing:-.02em;max-width:14em}.hero p{font-size:1.15rem;color:var(--mut);max-width:34em;margin:18px 0 26px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit}
.card img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--tint)}.card .b{padding:14px}.card h3{font-size:1.1rem}.card p{margin:4px 0 0;color:var(--mut);font-size:.92rem}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.ch button{font:500 .95rem Figtree;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.sv{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.sv img,.sv .ph{width:90px;height:70px;border-radius:10px;aspect-ratio:auto}

.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fl .f{grid-column:1/-1}label{display:block;font-size:.88rem;color:var(--mut)}
input,select,textarea{width:100%;font:1rem Figtree;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin-top:3px}textarea{min-height:80px}

.md{position:fixed;inset:0;background:rgba(8,16,26,.6);z-index:40;display:grid;place-items:center;padding:16px}.md[hidden]{display:none}
.mc{background:var(--card);border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:92vh;overflow:auto}.mc h2{font-size:1.4rem;margin:12px 0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
.cta{background:var(--teal);color:var(--on);border-radius:16px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.cta h2{margin:0;font-size:clamp(1.5rem,3.5vw,2rem)}.cta .btn{background:var(--on);color:var(--teal);border-color:var(--on)}
footer{padding:28px 0 40px;color:var(--mut);font-size:.92rem;border-top:1px solid var(--line)}footer .w{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
@media(max-width:760px){.g3,.fl{grid-template-columns:1fr}.sv{grid-template-columns:70px 1fr}.sv>:last-child{grid-column:1/-1}.sv img,.sv .ph{width:70px;height:56px}}
.fv{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--ink);cursor:pointer;font-size:1.15rem}.fv[aria-pressed=true]{color:#d6336c}.card{position:relative}.st{font-weight:600;font-size:.9rem}
.sbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px}.sbar input,.sbar select{margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.tile{background:var(--tint);border:0;border-radius:12px;padding:18px 12px;font:600 1rem Figtree;color:var(--ink);cursor:pointer}
.rv{border-bottom:1px solid var(--line);padding:10px 0}.rv p{margin:4px 0}@media(max-width:760px){.sbar{grid-template-columns:1fr}}
.er.good{color:#1a7f4b}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .er.good{color:#4cd08a}}:root[data-theme="dark"] .er.good{color:#4cd08a}
</style></head><body>

const sb=supabase.createClient('https://qjixjmmipslbdlwlobea.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFqaXhqbW1pcHNsYmRsd2xvYmVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjU5NzMsImV4cCI6MjEwODM0MTk3M30.4inin-vY6f4vUw7y9EOZtBsziWO5uFu-8exd19tReac');
let ses=null,role=null,mode='customer',up=false,F='',BK={},OW={},tt;

const toast=m=>{clearTimeout(tt);let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;tt=setTimeout(()=>t.hidden=true,3500)};
const pic=u=>u?'<img src="'+esc(u)+'" alt="" loading="lazy">':'<div class="ph"></div>',go=r=>{location.hash=r},iso=d=>d.toLocaleDateString('en-CA'),fd=d=>d.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});

async function auth(){const e=$('#ae').value.trim(),p=$('#ap').value,say=t=>$('#am').textContent=t;if(!/^\S+@\S+\.\S+$/.test(e)||p.length<8)return say('Enter a valid email and a password of at least 8 characters.');

async function route(){const r=location.hash.slice(1)||'home';let m;window.scrollTo(0,0);if(r==='browse')return browse();if(m=/^biz-(\d+)$/.exec(r))return biz(+m[1]);if(r==='me')return me();home()}

function startBk(sid,sn){if(!ses)return openM('Sign in as a customer to book.');if(role==='owner')return toast('Business owners cannot book. Sign in as a customer.');BK.s=sid;BK.sn=sn;BK.d=-1;BK.t=-1;BK.tk=[];drawBk();$('#bk').scrollIntoView({behavior:'smooth'})}

async function book(){const n=$('#n').value.trim(),p=$('#p').value.trim(),e=$('#e').value.trim();let m='';if(BK.d<0||BK.t<0)m='Choose a day and a time.';else if(n.length<2)m='Enter your name.';else if(!/^[+0-9 ()-]{9,15}$/.test(p))m='Enter a valid phone number.';else if(!/^\S+@\S+\.\S+$/.test(e))m='Enter a valid email address.';if(m){$('#er').textContent=m;return}

let PEND='',PW='',BUSY=0;

async function callSU(body){try{const r=await sb.functions.invoke('bookit-signup',{body});if(r.error)return{ok:false,error:'Could not reach the server. Check your internet connection.'};return r.data||{ok:false,error:'No response from the server.'}}catch(e){return{ok:false,error:'Could not reach the server. Check your internet connection.'}}}
function mm(msg,ok){const o=mode==='owner';

async function auth(){if(BUSY)return;const e=$('#ae').value.trim(),p=$('#ap').value;
if(!/^\S+@\S+\.\S+$/.test(e))return say('Enter a valid email address.');if(p.length<8)return say('Choose a password of at least 8 characters.');
BUSY=1;$('#ab').disabled=true;try{
if(up){const f=$('#rf').value.trim(),n=$('#rs').value.trim(),ph=$('#rp').value.replace(/[\s-]/g,'');
if(f.length<2||n.length<2)return say('Enter your first name and surname.');if(!/^(\+27|0)[0-9]{9}$/.test(ph))return say('Enter a valid South African phone number, for example 071 234 5678.');

if(r.ok){PEND=e;PW=p;up=false;return mm('Account created. We sent a code to '+e+'. Enter it below.',true)}

if(r.error){if(/not confirmed/i.test(r.error.message)){PEND=e;PW=p;const x=await callSU({action:'resend',email:e});return mm(x.ok?'Your email is not confirmed yet. We sent you a new code.':x.error,x.ok)}return say(r.error.message)}
const q=await sb.rpc('bookit_my_role'),rl=q.data||'customer';if(rl!==mode){await sb.auth.signOut();return say('This is a '+rl+' account. Use the '+(rl==='owner'?'Business owner':'Customer')+' tab.')}$('#md').hidden=true}finally{BUSY=0;const b=$('#ab');if(b)b.disabled=false}}
async function verify(){if(BUSY)return;const t=$('#ac').value.trim();if(!/^\d{6}$/.test(t))return say('Enter the 6-digit code from the email.');BUSY=1;

async function resend(){const r=await callSU({action:'resend',email:PEND});say(r.ok?'A new code was sent to '+PEND+'.':r.error,r.ok)}

BUSY=1;$('#cb').disabled=true;$('#cb').textContent='Booking...';const slot=BK.av[BK.t];
try{const r=await sb.from('bookit_bookings').insert({business_id:BK.b,service_id:BK.s,day:iso(DAYS[BK.d]),slot,name:n,phone:p,email:e}).select('id,ref').single();
if(r.error){await pk('d',BK.d);$('#er').textContent=(r.error.code==='23505'||/not available|passed/i.test(r.error.message))?'That time was just taken. Pick another.':'Could not save your booking. Try again.';return}
const sent=await notify(r.data.id,'new');
$('#bk').innerHTML='<div class="ok"><h2 style="font-size:1.4rem">Booking received</h2><p>Reference <b>'+r.data.ref+'</b>: '+esc(BK.sn)+', '+fd(DAYS[BK.d])+' at '+slot+'. Status: Pending. The business will confirm it.</p><p class="'+(sent?'good':'')+'">'+(sent?'We emailed a confirmation to '+esc(e)+'.':'Your booking is saved, but we could not send the email. Check My bookings for the status.')+'</p><button class="btn" onclick="go(\'me\')">My bookings</button></div>'}finally{BUSY=0}}
async function setSt(id,s){const r=await sb.from('bookit_bookings').update({status:s}).eq('id',id);if(r.error){toast('Could not update.');return}const sent=await notify(id,'status');toast(sent?'Updated. The customer was emailed.':'Updated. The email could not be sent.');me()}
async function cancelMine(id){if(!confirm('Cancel this booking?'))return;const r=await sb.from('bookit_bookings').update({status:'Cancelled'}).eq('id',id);if(r.error){toast('Could not cancel.');return}const sent=await notify(id,'status');toast(sent?'Booking cancelled. Emails sent.':'Booking cancelled. The email could not be sent.');me()}
const _me=me;me=async function(){await _me();if(role==='owner'&&OW.b)await exUI()};
async function exUI(){const r=await sb.from('bookit_exceptions').select('*').eq('business_id',OW.b.id).gte('day',iso(new Date())).order('day'),l=r.data||[],sec=document.querySelector('#v section');if(!sec)return;
sec.insertAdjacentHTML('beforeend','<h2 style="margin-top:28px">Closed days and special hours</h2><div class="box">'+tbl(['Date','What','Reason',''],l.map(x=>'<tr><td>'+x.day+'</td><td>'+(x.closed?'Closed all day':'Open '+(x.open_time||'').slice(0,5)+' to '+(x.close_time||'').slice(0,5))+'</td><td>'+esc(x.reason)+'</td><td><button class="btn alt" onclick="delEx('+x.id+')">Remove</button></td></tr>'))+'<form onsubmit="return addEx(event)" novalidate style="margin-top:12px"><div class="fl"><label>Date<input id="xd" type="date" min="'+iso(new Date())+'"></label><label>Type<select id="xt"><option value="c">Closed all day</option><option value="s">Special hours</option></select></label><label>Opens<input id="xo" type="time"></label><label>Closes<input id="xc" type="time"></label><label class="f">Reason (optional)<input id="xr"></label></div><button class="btn" style="margin-top:10px">Save date</button></form></div>')}
async function addEx(e){e.preventDefault();const d=$('#xd').value,t=$('#xt').value;if(!d){toast('Choose a date.');return false}if(t==='s'&&(!$('#xo').value||!$('#xc').value||$('#xo').value>=$('#xc').value)){toast('Enter opening and closing times.');return false}
const r=await sb.from('bookit_exceptions').upsert({business_id:OW.b.id,day:d,closed:t==='c',open_time:t==='s'?$('#xo').value:null,close_time:t==='s'?$('#xc').value:null,reason:$('#xr').value.trim()},{onConflict:'business_id,day'});toast(r.error?'Could not save.':'Saved');me();return false}
async function delEx(id){const r=await sb.from('bookit_exceptions').delete().eq('id',id);if(r.error)toast('Could not remove.');me()}
head();route();
</script>
